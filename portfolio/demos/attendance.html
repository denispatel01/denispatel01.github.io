<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Analytics — Live Demo · Denis Patel</title>
  <meta name="description" content="Interactive demo of the school Attendance Summary report — the same dynamic HTML report emailed daily to stakeholders, with generated sample data." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="demos.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👨‍💻</text></svg>" />
  <style>
    /* Light "email report" canvas — mirrors the real daily email */
    .report-wrap { padding: 22px; }
    .report {
      background: #ffffff; color: #1f2430; width: 100%; margin: 0;
      border-radius: 14px; padding: 26px 28px; font-size: 14px; line-height: 1.5;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }
    .report h1 { font-size: 1.35rem; color: #1f2430; margin: 0 0 18px; font-weight: 800; }
    .report h2 { font-size: 1.05rem; color: #6d28d9; margin: 0 0 12px; font-weight: 700; }
    .rgrid { display: grid; grid-template-columns: 1fr 1.15fr; gap: 22px; align-items: start; }
    @media (max-width: 900px) { .rgrid { grid-template-columns: 1fr; } }
    .rcards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .rcard { border-radius: 12px; padding: 14px 16px; }
    .rcard.blue { background: linear-gradient(135deg,#eef2ff,#e0e7ff); border-left: 4px solid #6366f1; }
    .rcard.green { background: linear-gradient(135deg,#ecfdf5,#d1fae5); border-left: 4px solid #10b981; }
    .rcard .lbl { font-size: .72rem; color: #4b5563; font-weight: 600; }
    .rcard .big { font-size: 1.55rem; font-weight: 800; margin-top: 2px; }
    .datebox { background:#fce7f3; border-left:4px solid #db2777; padding:8px 14px; border-radius:8px; color:#9d174d; font-weight:700; display:inline-block; margin-bottom:16px; }
    .rtable { width: 100%; border-collapse: collapse; font-size: 13px; }
    .rtable th { background: #f3f4f6; color: #374151; font-weight: 700; padding: 8px 10px; border: 1px solid #e5e7eb; text-align: center; }
    .rtable td { padding: 7px 10px; border: 1px solid #e5e7eb; text-align: center; }
    .rtable td.l { text-align: left; font-weight: 600; }
    .up { color: #059669; font-weight: 700; }
    .down { color: #dc2626; font-weight: 700; }
    .muted2 { color: #6b7280; }
    .trend-box { background: linear-gradient(135deg,#faf5ff,#f3e8ff); border-radius: 12px; padding: 16px; margin-bottom: 18px; }
    .trend-box h2 { color:#7c3aed; }
    .note { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; padding:9px 13px; border-radius:9px; font-size:12.5px; margin-bottom:12px; }
    .two-col { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:18px; }
    @media (max-width:640px){ .two-col{grid-template-columns:1fr;} .rcards{grid-template-columns:1fr;} }
    .col-top { border-top:4px solid #10b981; background:#f0fdf4; border-radius:10px; padding:12px; }
    .col-bot { border-top:4px solid #ef4444; background:#fef2f2; border-radius:10px; padding:12px; }
    .col-top h3, .col-bot h3 { margin:0 0 10px; font-size:.92rem; }
    .sumtitle { color:#b91c1c; font-weight:800; margin:0 0 10px; font-size:1.05rem; }
  </style>
</head>
<body style="overflow-x:hidden">

  <div class="demo-banner">
    <b>▶ Interactive Demo</b> — Daily Attendance Summary · the actual dynamic HTML report, with generated sample data.
    <span class="spacer"></span>
    <a href="../projects/attendance-analytics.html">← Read the case study</a>
  </div>

  <!-- Control toolbar (the "generator" side) -->
  <div style="padding:16px 22px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <label style="font-size:.82rem;color:var(--muted)">Report date:</label>
    <input type="date" class="select" id="repDate" />
    <button class="dbtn" id="regen">🔄 Regenerate</button>
    <button class="dbtn ghost" id="send">✉️ Send to stakeholders</button>
    <span class="grow" style="flex:1"></span>
    <span class="bdg blue" id="genInfo"></span>
  </div>
  <div class="log" id="sendLog" style="margin:12px 22px 0;display:none"></div>

  <div class="report-wrap">
    <div class="report" id="report"><!-- generated --></div>
  </div>

  <div class="toast-d" id="toast"></div>
  <script src="attendance.js"></script>
</body>
</html>
