<script>
/* Thin client — all data lives server-side (Google Sheet). */
const $ = (s) => document.querySelector(s);
let editingNoteId = null;

/* ---- server call wrapper ---- */
function call(fn, args, onDone) {
  $("#loader").classList.add("show");
  google.script.run
    .withSuccessHandler(function (res) {
      $("#loader").classList.remove("show");
      if (onDone) onDone(res);
    })
    .withFailureHandler(function (err) {
      $("#loader").classList.remove("show");
      toast("⚠️ " + err.message);
    })[fn].apply(google.script.run, args || []);
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function () { t.classList.remove("show"); }, 2200);
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
  });
}

function fmtDate(d) {
  if (!d) return "";
  const dt = new Date(d);
  return isNaN(dt) ? d : dt.toLocaleString();
}

/* ---- relative time ---- */
function relativeTime(iso) {
  if (!iso) return "";
  var target = new Date(iso);
  var now = new Date();
  var diff = target - now;
  if (isNaN(target)) return "";
  if (diff < 0) return "overdue";
  var mins = Math.floor(diff / 60000);
  if (mins < 60) return "in " + mins + "m";
  var hrs = Math.floor(mins / 60);
  if (hrs < 24) return "in " + hrs + "h " + (mins % 60) + "m";
  var days = Math.floor(hrs / 24);
  return "in " + days + "d " + (hrs % 24) + "h";
}

/* ---- tabs ---- */
document.querySelectorAll(".tab").forEach(function (btn) {
  btn.addEventListener("click", function () {
    document.querySelectorAll(".tab").forEach(function (b) { b.classList.remove("active"); });
    document.querySelectorAll(".view").forEach(function (v) { v.classList.remove("active"); });
    btn.classList.add("active");
    $("#view-" + btn.dataset.tab).classList.add("active");
  });
});

/* ==================================================================
   UI actions
================================================================== */
const ui = {
  /* ---- summary ---- */
  loadSummary: function () {
    call("getSummary", [], function (s) {
      $("#who").textContent = "Signed in as " + s.email;
      $("#summaryCards").innerHTML =
        card(s.openTodos, "Open to-dos") +
        card(s.upcomingReminders, "Upcoming reminders") +
        card(s.vaultItems, "Vault items") +
        card(s.notes, "Notes");
    });
  },

  /* ---- todos ---- */
  loadTodos: function () { call("getTodos", [], renderTodos); },
  addTodo: function () {
    const t = $("#todoInput").value.trim();
    if (!t) return;
    call("addTodo", [t, $("#todoPriority").value], renderTodos);
    $("#todoInput").value = "";
  },
  toggleTodo: function (id) { call("toggleTodo", [id], renderTodos); },
  delTodo: function (id) { call("deleteTodo", [id], renderTodos); },

  /* ---- reminders ---- */
  loadReminders: function () { call("getReminders", [], renderReminders); },
  addReminder: function () {
    const t = $("#remTitle").value.trim();
    if (!t) { toast("Enter a reminder title"); return; }
    const sched = buildSchedule();
    if (sched.error) { toast(sched.error); return; }
    call("addReminder", [t, JSON.stringify(sched)], function (list) {
      renderReminders(list); resetBuilder(); toast("Reminder added ✓");
    });
  },
  delReminder: function (id) { call("deleteReminder", [id], renderReminders); },

  /* ---- vault ---- */
  loadVault: function () { call("getVault", [], renderVault); },
  addVault: function () {
    const l = $("#vLabel").value.trim();
    const v = $("#vValue").value.trim();
    if (!l || !v) { toast("Enter a label and value"); return; }
    call("addVaultItem", [l, v, $("#vCat").value.trim()], renderVault);
    $("#vLabel").value = ""; $("#vValue").value = ""; $("#vCat").value = "";
  },
  delVault: function (id) { call("deleteVaultItem", [id], renderVault); },

  /* ---- notes ---- */
  loadNotes: function () { call("getNotes", [], renderNotes); },
  newNote: function () { editingNoteId = null; $("#noteTitle").value = ""; $("#noteBody").value = ""; $("#noteTitle").focus(); },
  saveNote: function () {
    const t = $("#noteTitle").value.trim() || "Untitled";
    call("saveNote", [editingNoteId, t, $("#noteBody").value], function (notes) {
      editingNoteId = null; $("#noteTitle").value = ""; $("#noteBody").value = "";
      renderNotes(notes); toast("Saved ✓");
    });
  },
  editNote: function (id, title, body) { editingNoteId = id; $("#noteTitle").value = title; $("#noteBody").value = body; },
  delNote: function (id, e) { e.stopPropagation(); call("deleteNote", [id], renderNotes); },
};

/* ==================================================================
   Renderers
================================================================== */
function card(n, l) { return '<div class="card"><div class="n">' + n + '</div><div class="l">' + l + '</div></div>'; }

function renderTodos(list) {
  list.sort(function (a, b) { return (a.done - b.done); });
  $("#todoList").innerHTML = list.length ? list.map(function (t) {
    return '<li class="item ' + (t.done ? "done" : "") + '">' +
      '<div class="check ' + (t.done ? "on" : "") + '" onclick="ui.toggleTodo(\'' + t.id + '\')"><span>' + (t.done ? "✓" : "") + '</span></div>' +
      '<div class="txt">' + esc(t.title) + '</div>' +
      '<span class="pill ' + esc(t.priority) + '">' + esc(t.priority) + '</span>' +
      '<button class="del" onclick="ui.delTodo(\'' + t.id + '\')">✕</button></li>';
  }).join("") : '<p class="hint">No tasks yet. Add one above.</p>';
}

/* ---------- Reminder schedule helpers ---------- */
function parseSched(raw) {
  if (raw && typeof raw === "object") return raw;
  try { var o = JSON.parse(raw); if (o && o.kind) return o; } catch (e) {}
  return { kind: "once" };
}

var DOW_LBL = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

function describeSchedClient(s) {
  if (!s || s.kind === "once") return "one-time";
  if (s.kind === "hourly") return "every " + (s.everyHours || 1) + " hour(s)";
  if (s.kind === "daily") {
    var times = (s.times && s.times.length ? s.times : ["09:00"]).join(", ");
    return "every " + (s.everyDays || 1) + " day(s) at " + times;
  }
  var times = (s.times && s.times.length ? s.times : ["09:00"]).join(", ");
  var wd = (s.weekdays || []).map(function (d) { return DOW_LBL[d]; }).join(", ");
  var md = (s.monthdays || []).join(", ");
  if (s.kind === "weekly") return "weekly · " + wd + " · " + times;
  if (s.kind === "monthly") return "monthly · day " + md + " · " + times;
  return "custom · " + (wd ? wd + " " : "") + (md ? "day " + md + " " : "") + times;
}

function schedBadge(s) {
  if (!s) return { cls: "badge-once", label: "One-time" };
  switch (s.kind) {
    case "hourly":  return { cls: "badge-hourly",  label: "⏱ Hourly" };
    case "daily":   return { cls: "badge-daily",   label: "📅 Daily" };
    case "weekly":  return { cls: "badge-weekly",  label: "📆 Weekly" };
    case "monthly": return { cls: "badge-monthly", label: "🗓️ Monthly" };
    case "once":    return { cls: "badge-once",    label: "🎯 Once" };
    default:        return { cls: "badge-custom",  label: "⚙ Custom" };
  }
}

function renderReminders(list) {
  list.sort(function (a, b) { return new Date(a.remindAt) - new Date(b.remindAt); });
  if (!list.length) {
    $("#reminderList").innerHTML = '<p class="hint">No reminders set. Use the builder above or quick presets to add one.</p>';
    return;
  }
  $("#reminderList").innerHTML = list.map(function (r) {
    var s = parseSched(r.schedule);
    var badge = schedBadge(s);
    var isDone = !!r.notified;
    var isRecurring = s.kind !== "once";
    var statusCls = isDone ? "rem-status-done" : "rem-status-active";
    var statusIcon = isDone ? "✅" : (isRecurring ? '<span class="pulse-dot"></span>' : '<span class="pulse-dot once-dot"></span>');
    var nextLabel = isDone ? "Completed" : relativeTime(r.remindAt);

    return '<li class="rem-card ' + statusCls + '">' +
      '<div class="rem-card-header">' +
        '<span class="rem-badge ' + badge.cls + '">' + badge.label + '</span>' +
        '<div class="rem-card-actions">' +
          '<span class="rem-status-indicator">' + statusIcon + '</span>' +
          '<button class="del" onclick="ui.delReminder(\'' + r.id + '\')">✕</button>' +
        '</div>' +
      '</div>' +
      '<div class="rem-card-body">' +
        '<div class="rem-card-title">' + esc(r.title) + '</div>' +
        '<div class="rem-card-schedule">🔁 ' + esc(describeSchedClient(s)) + '</div>' +
        '<div class="rem-card-footer">' +
          '<span class="rem-next-fire">' + (isDone ? '✅ Done' : '🕐 Next: ' + fmtDate(r.remindAt)) + '</span>' +
          '<span class="rem-countdown ' + (isDone ? '' : 'active') + '">' + nextLabel + '</span>' +
        '</div>' +
      '</div>' +
    '</li>';
  }).join("");
}

/* ---------- Reminder builder (form → schedule object) ---------- */
function addTimeInput(val) {
  var wrap = document.createElement("span");
  wrap.className = "time-chip";
  wrap.innerHTML = '<input type="time" value="' + (val || "09:00") + '"><button type="button" title="remove">✕</button>';
  wrap.querySelector("button").addEventListener("click", function () {
    if ($("#remTimes").children.length > 1) wrap.remove();
  });
  $("#remTimes").appendChild(wrap);
}
function getTimes() {
  return [].map.call($("#remTimes").querySelectorAll("input"), function (i) { return i.value || "09:00"; });
}
function getWeekdays() {
  return [].filter.call($("#remDow").querySelectorAll("button"), function (b) { return b.classList.contains("on"); })
    .map(function (b) { return +b.dataset.d; });
}
function getMonthdays() {
  return ($("#remMonthdays").value || "").split(",").map(function (x) { return parseInt(x, 10); })
    .filter(function (n) { return n >= 1 && n <= 31; });
}

function buildSchedule() {
  var kind = $("#remKind").value;
  var email = $("#remEmail").value.trim();
  
  var result = { error: "Unknown schedule type" };
  
  if (kind === "once") {
    var at = $("#remAt").value;
    if (!at) return { error: "Pick a date & time" };
    result = { kind: "once", at: new Date(at).toISOString() };
  } else if (kind === "hourly") {
    result = { kind: "hourly", everyHours: Math.max(1, +$("#remEveryHours").value || 1) };
  } else if (kind === "daily") {
    var times = getTimes();
    result = { kind: "daily", everyDays: Math.max(1, +$("#remEveryDays").value || 1), times: times };
  } else if (kind === "weekly") {
    var wd = getWeekdays();
    if (!wd.length) return { error: "Pick at least one day" };
    var times = getTimes();
    result = { kind: "weekly", weekdays: wd, times: times };
  } else if (kind === "monthly") {
    var md = getMonthdays();
    if (!md.length) return { error: "Enter at least one date (e.g. 1, 15)" };
    var times = getTimes();
    result = { kind: "monthly", monthdays: md, times: times };
  }
  
  if (!result.error && email) {
    result.email = email;
  }
  
  return result;
}

function resetBuilder() {
  $("#remTitle").value = "";
  $("#remEmail").value = "";
}

function applyPreset(preset) {
  var kindSel = $("#remKind");
  // clear previous weekday selections
  [].forEach.call($("#remDow").querySelectorAll("button"), function (b) { b.classList.remove("on"); });
  // clear times
  $("#remTimes").innerHTML = "";

  switch (preset) {
    case "1h":  kindSel.value = "hourly"; $("#remEveryHours").value = 1; break;
    case "2h":  kindSel.value = "hourly"; $("#remEveryHours").value = 2; break;
    case "4h":  kindSel.value = "hourly"; $("#remEveryHours").value = 4; break;
    case "6h":  kindSel.value = "hourly"; $("#remEveryHours").value = 6; break;
    case "12h": kindSel.value = "hourly"; $("#remEveryHours").value = 12; break;
    case "daily9":
      kindSel.value = "daily"; $("#remEveryDays").value = 1;
      addTimeInput("09:00"); break;
    case "daily10":
      kindSel.value = "daily"; $("#remEveryDays").value = 1;
      addTimeInput("10:00"); break;
    case "weekdays":
      kindSel.value = "weekly";
      [1,2,3,4,5].forEach(function (d) {
        var btn = $("#remDow").querySelector('[data-d="' + d + '"]');
        if (btn) btn.classList.add("on");
      });
      addTimeInput("09:00"); break;
    case "weekends":
      kindSel.value = "weekly";
      [0,6].forEach(function (d) {
        var btn = $("#remDow").querySelector('[data-d="' + d + '"]');
        if (btn) btn.classList.add("on");
      });
      addTimeInput("10:00"); break;
    case "every2d":
      kindSel.value = "daily"; $("#remEveryDays").value = 2;
      addTimeInput("09:00"); break;
  }
  // trigger visibility sync
  syncKindVisibility();
  // focus the title if empty
  if (!$("#remTitle").value.trim()) $("#remTitle").focus();
}

function syncKindVisibility() {
  var k = $("#remKind").value;
  [].forEach.call(document.querySelectorAll(".rem-opt"), function (el) {
    el.style.display = el.dataset.kind.split(" ").indexOf(k) >= 0 ? "" : "none";
  });
}

function initReminderBuilder() {
  // weekday toggle buttons — all 7 days
  $("#remDow").innerHTML = DOW_LBL.map(function (d, i) {
    return '<button type="button" data-d="' + i + '">' + d + '</button>';
  }).join("");
  $("#remDow").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (b) b.classList.toggle("on");
  });
  addTimeInput("09:00");
  $("#addTime").addEventListener("click", function () { addTimeInput("18:00"); });

  // show/hide option blocks per kind
  $("#remKind").addEventListener("change", function () {
    syncKindVisibility();
    // ensure at least one time input for kinds that need it
    if (["daily", "weekly", "monthly"].indexOf($("#remKind").value) >= 0 && $("#remTimes").children.length === 0) {
      addTimeInput("09:00");
    }
  });
  syncKindVisibility();

  // preset buttons
  document.querySelectorAll(".preset-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      // highlight active preset
      document.querySelectorAll(".preset-btn").forEach(function (b) { b.classList.remove("active"); });
      btn.classList.add("active");
      applyPreset(btn.dataset.preset);
    });
  });
}

/* ---------- Vault ---------- */
function renderVault(list) {
  $("#vaultList").innerHTML = list.length ? list.map(function (v) {
    return '<div class="vault-item">' +
      '<button class="del" onclick="ui.delVault(\'' + v.id + '\')">✕</button>' +
      '<div class="cat">' + esc(v.category) + '</div>' +
      '<div class="lbl">' + esc(v.label) + '</div>' +
      '<div class="val" title="click to reveal" onclick="this.classList.toggle(\'show\')">' + esc(v.value) + '</div>' +
      '</div>';
  }).join("") : '<p class="hint">Vault is empty. Values stay blurred until you click them.</p>';
}

/* ---------- Notes ---------- */
function renderNotes(list) {
  list.sort(function (a, b) { return new Date(b.updated) - new Date(a.updated); });
  $("#noteList").innerHTML = list.length ? list.map(function (n) {
    var body = String(n.body || "").replace(/'/g, "\\'").replace(/\n/g, " ");
    var title = String(n.title || "").replace(/'/g, "\\'");
    return '<li class="item" onclick="ui.editNote(\'' + n.id + '\',\'' + title + '\',\'' + body + '\')">' +
      '<div style="display:flex;justify-content:space-between;align-items:center">' +
      '<h4>' + esc(n.title) + '</h4>' +
      '<button class="del" onclick="ui.delNote(\'' + n.id + '\',event)">✕</button></div>' +
      '<div class="sub">' + fmtDate(n.updated) + '</div></li>';
  }).join("") : '<p class="hint">No notes yet.</p>';
}

/* ---- boot ---- */
window.addEventListener("load", function () {
  initReminderBuilder();
  ui.loadSummary();
  ui.loadTodos();
  ui.loadReminders();
  ui.loadVault();
  ui.loadNotes();
  // refresh countdown every minute
  setInterval(function () { ui.loadReminders(); }, 60000);
});
</script>
