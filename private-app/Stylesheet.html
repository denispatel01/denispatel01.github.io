<style>
  :root {
    --bg: #0f1219; --panel: #171b26; --card: #1e2431; --border: #2a3140;
    --text: #e6e9ef; --muted: #8b93a7; --accent: #6ea8fe; --accent2: #a78bfa;
    --green: #4ade80; --red: #f87171; --amber: #fbbf24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, Arial, sans-serif; background: var(--bg); color: var(--text); }
  .app { display: flex; min-height: 100vh; }

  /* Sidebar */
  .sidebar { width: 230px; background: var(--panel); border-right: 1px solid var(--border); padding: 22px 16px; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .logo { font-weight: 800; font-size: 1.15rem; margin-bottom: 26px; }
  nav { display: flex; flex-direction: column; gap: 4px; }
  .tab { text-align: left; background: none; border: none; color: var(--muted); font-size: .96rem; padding: 11px 14px; border-radius: 10px; cursor: pointer; font-family: inherit; transition: .15s; }
  .tab:hover { background: var(--card); color: var(--text); }
  .tab.active { background: linear-gradient(120deg, var(--accent), var(--accent2)); color: #0f1219; font-weight: 700; }
  .who { margin-top: auto; font-size: .78rem; color: var(--muted); word-break: break-all; padding-top: 16px; border-top: 1px solid var(--border); }

  /* Main */
  .main { flex: 1; padding: 34px 40px; max-width: 900px; }
  .view { display: none; animation: fade .3s; }
  .view.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }
  h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: 22px; letter-spacing: -.5px; }
  .hint { color: var(--muted); font-size: .88rem; margin-bottom: 18px; margin-top: -10px; }

  /* Inputs */
  .row { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
  input, select, textarea { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 11px 14px; border-radius: 10px; font-family: inherit; font-size: .94rem; flex: 1; min-width: 120px; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { width: 100%; min-height: 240px; resize: vertical; line-height: 1.6; }
  .btn { background: linear-gradient(120deg, var(--accent), var(--accent2)); color: #0f1219; border: none; font-weight: 700; padding: 11px 20px; border-radius: 10px; cursor: pointer; font-family: inherit; flex: 0; white-space: nowrap; }
  .btn:hover { opacity: .9; }
  .btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }

  /* Lists */
  .list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .item .txt { flex: 1; }
  .item .sub { color: var(--muted); font-size: .78rem; }
  .item.done .txt { text-decoration: line-through; color: var(--muted); }
  .check { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--border); cursor: pointer; flex-shrink: 0; display: grid; place-items: center; font-size: .8rem; }
  .check.on { background: var(--green); border-color: var(--green); color: #0f1219; }
  .pill { font-size: .68rem; padding: 3px 9px; border-radius: 999px; font-weight: 600; }
  .pill.high { background: rgba(248,113,113,.15); color: var(--red); }
  .pill.low { background: rgba(139,147,167,.15); color: var(--muted); }
  .pill.normal { background: rgba(110,168,254,.15); color: var(--accent); }
  .del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 1.1rem; padding: 4px; }
  .del:hover { color: var(--red); }

  /* Cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px; }
  .card .n { font-size: 2rem; font-weight: 800; background: linear-gradient(120deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .card .l { color: var(--muted); font-size: .85rem; margin-top: 4px; }
  .card.muted { color: var(--muted); }

  /* Vault */
  .vault-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .vault-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; position: relative; }
  .vault-item .cat { font-size: .68rem; color: var(--accent2); text-transform: uppercase; letter-spacing: 1px; }
  .vault-item .lbl { font-size: .82rem; color: var(--muted); margin: 6px 0 4px; }
  .vault-item .val { font-family: 'JetBrains Mono', monospace; font-size: .95rem; word-break: break-all; filter: blur(5px); cursor: pointer; transition: filter .15s; }
  .vault-item .val.show { filter: none; }
  .vault-item .del { position: absolute; top: 10px; right: 10px; }

  /* Notes */
  .notes-layout { display: grid; grid-template-columns: 1.6fr 1fr; gap: 20px; }
  .notes-editor input { width: 100%; margin-bottom: 10px; }
  .notes-list .item { flex-direction: column; align-items: stretch; cursor: pointer; }
  .notes-list .item:hover { border-color: var(--accent); }
  .notes-list h4 { font-size: .95rem; margin-bottom: 4px; }

  /* Toast + loader */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--card); border: 1px solid var(--border); padding: 12px 22px; border-radius: 12px; transition: transform .3s; z-index: 100; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .loader { position: fixed; top: 16px; right: 16px; opacity: 0; transition: .2s; }
  .loader.show { opacity: 1; }
  .spin { width: 20px; height: 20px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: r .7s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }

  @media (max-width: 720px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: static; flex-direction: row; flex-wrap: wrap; align-items: center; }
    nav { flex-direction: row; flex-wrap: wrap; }
    .who { display: none; }
    .main { padding: 24px 18px; }
    .notes-layout { grid-template-columns: 1fr; }
  }
</style>
